[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# 1. Redirecionamento da API (PRECISA VIR ANTES)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# 2. Fallback do React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
